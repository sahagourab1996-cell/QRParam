<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07070c">
<meta name="description" content="Parama Jewellery Museum — hallmarked jewellery. Connect with us on social media and find our showroom.">
<title>Parama Jewellery Museum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ░░ Loader ░░ -->
<div class="loader" id="loader">
  <div class="loader-gem"><span></span><span></span><span></span></div>
  <div class="loader-text">P A R A M A</div>
</div>

<!-- ░░ Ambient background layers ░░ -->
<div class="bg">
  <div class="bg-aurora"></div>
  <div class="bg-vignette"></div>
  <div class="bg-grid"></div>
  <div class="bg-scan"></div>
</div>
<canvas id="dust" aria-hidden="true"></canvas>

<!-- ░░ Stage ░░ -->
<main class="stage">
  <section class="card" id="card">
    <div class="card-sheen"></div>
    <div class="card-corner tl"></div>
    <div class="card-corner tr"></div>
    <div class="card-corner bl"></div>
    <div class="card-corner br"></div>

    <!-- 3D gem -->
    <div class="gem-stage reveal" data-depth="70">
      <div class="gem-halo"></div>
      <div class="gem" id="gem" aria-hidden="true"></div>
      <div class="gem-floor"></div>
    </div>

    <header class="head">
      <h1 class="logo-wrap reveal" data-depth="50">
        <img src="logo.png" alt="Parama Jewellery Museum" class="logo">
      </h1>
      <div class="rule reveal" data-depth="30">
        <i></i><span class="rule-gem"></span><i></i>
      </div>

      <p class="tagline reveal" data-depth="25">
        Find us on social media<br>
        <b>&amp; visit our showroom.</b>
      </p>
    </header>

    <h2 class="wordmark reveal" data-depth="40" aria-label="Connect">
      <span>C</span><span>O</span><span>N</span><span>N</span><span>E</span><span>C</span><span>T</span>
    </h2>

    <nav class="links" aria-label="Social links">
      <a class="link link-primary reveal" data-depth="34" style="--i:1" href="https://search.google.com/local/writereview?placeid=ChIJvzWywhmj-DkRzGSlTwhjPQw" target="_blank" rel="noopener noreferrer">
        <span class="link-fill"></span>
        <span class="link-ico"><i class="fas fa-star"></i></span>
        <span class="link-txt"><b>Rate us on Google</b><small>It takes about 30 seconds</small></span>
        <span class="link-go"><i class="fas fa-arrow-right"></i></span>
      </a>

      <a class="link reveal" data-depth="34" style="--i:2" href="https://www.facebook.com/hallmarked.jewellery" target="_blank" rel="noopener noreferrer">
        <span class="link-fill"></span>
        <span class="link-ico"><i class="fab fa-facebook-f"></i></span>
        <span class="link-txt"><b>Facebook</b><small>hallmarked.jewellery</small></span>
        <span class="link-go"><i class="fas fa-arrow-right"></i></span>
      </a>

      <a class="link reveal" data-depth="34" style="--i:3" href="https://www.instagram.com/parama_jewellery_museum" target="_blank" rel="noopener noreferrer">
        <span class="link-fill"></span>
        <span class="link-ico"><i class="fab fa-instagram"></i></span>
        <span class="link-txt"><b>Instagram</b><small>parama_jewellery_museum</small></span>
        <span class="link-go"><i class="fas fa-arrow-right"></i></span>
      </a>

      <a class="link reveal" data-depth="34" style="--i:4" href="https://www.youtube.com/@paramajewellery" target="_blank" rel="noopener noreferrer">
        <span class="link-fill"></span>
        <span class="link-ico"><i class="fab fa-youtube"></i></span>
        <span class="link-txt"><b>YouTube</b><small>@paramajewellery</small></span>
        <span class="link-go"><i class="fas fa-arrow-right"></i></span>
      </a>

      <a class="link reveal" data-depth="34" style="--i:5" href="https://www.google.com/maps/place/PARAMA+JEWELLERY+MUSEUM/@22.7192958,88.485404,20z/data=!4m15!1m8!3m7!1s0x39f898a92a30d755:0xdd50e1d4ad058b0b!2sBhatrapally,+Kolkata,+West+Bengal!3b1!8m2!3d22.7183908!4d88.4730853!16s%2Fg%2F12hmtnyny!3m5!1s0x39f8a319c2b235bf:0xc3d63084fa564cc!8m2!3d22.7193075!4d88.4857306!16s%2Fg%2F11s34fxw5s?entry=ttu&amp;g_ep=EgoyMDI1MDkxNy4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer">
        <span class="link-fill"></span>
        <span class="link-ico"><i class="fas fa-location-dot"></i></span>
        <span class="link-txt"><b>Visit the Showroom</b><small>Bhatrapally, Kolkata</small></span>
        <span class="link-go"><i class="fas fa-arrow-right"></i></span>
      </a>
    </nav>

    <button class="qr-btn reveal" data-depth="20" id="qrBtn" type="button">
      <i class="fas fa-qrcode"></i><span>QR codes</span>
    </button>

    <footer class="foot reveal" data-depth="14">
      <span class="pulse"></span> Bhatrapally &middot; Kolkata
    </footer>
  </section>
</main>

<!-- ░░ QR overlay ░░ -->
<div class="qr-modal" id="qrModal" role="dialog" aria-modal="true" aria-label="QR code">
  <div class="qr-box">
    <button class="qr-close" id="qrClose" type="button" aria-label="Close"><i class="fas fa-xmark"></i></button>
    <div class="qr-grid">
      <figure class="qr-item">
        <div class="qr-frame"><img src="qr-review.png" alt="QR code that opens the Google review form for Parama Jewellery Museum"></div>
        <figcaption><b>Rate us on Google</b><span>Print this for the counter</span></figcaption>
      </figure>
      <figure class="qr-item">
        <div class="qr-frame"><img src="QRParam_qr.png" alt="QR code linking to this page"></div>
        <figcaption><b>This page</b><span>All our links</span></figcaption>
      </figure>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
